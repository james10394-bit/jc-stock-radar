name: Opening market snapshots
on:
  workflow_dispatch:
  schedule:
    # 09:00-13:30 Asia/Taipei; schedules can start late.
    - cron: '*/5 1-4 * * 1-5'
    - cron: '0,5,10,15,20,25,30 5 * * 1-5'
permissions:
  contents: write
concurrency:
  group: stock-snapshot-writes
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public executed-trade snapshots
        run: python3 -u scripts/intraday.py --once
      - name: Commit snapshot only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/intraday.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh timestamped market snapshot'
          git pull --rebase
          git push
